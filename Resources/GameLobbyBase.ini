HoverTexture=optionsButton_c.png
DistanceFromRightBorder=0
DistanceFromBottomBorder=0

; ==============================
; Game Options Panel
;
; 2-column checkbox layout + 4-column dropdown rows.
; Column offsets (from panel left, EMPTY_SPACE_SIDES=12, each column block=100px):
;   Col0 = EMPTY_SPACE_SIDES             (12)   — left checkboxes, Units, Ore Growth
;   Col1 = EMPTY_SPACE_SIDES + 100       (112)  — Credits, Tech Defense
;   Col2 = EMPTY_SPACE_SIDES + 200       (212)  — right checkboxes, Tech Level, Superweapons
;   Col3 = EMPTY_SPACE_SIDES + 300       (312)  — Game Speed
; Dropdown width: 96px. Panel width: 440px.
; ==============================

[GameOptionsPanel]
$Width=420
$Height=270
$X=getWidth($ParentControl) - getWidth($Self) - LOBBY_EMPTY_SPACE_SIDES
$Y=EMPTY_SPACE_TOP
SolidColorBackgroundTexture=0,0,0,200

; Top dropdown row: Unit Count, Credits, Tech Level, Game Speed
; Registered first — left-column checkboxes anchor their Y to cmbUnitCount.
$CC-GO01=lblUnitCount:XNALabel
$CC-GO02=cmbUnitCount:GameLobbyDropDown
$CC-GO03=lblCredits:XNALabel
$CC-GO04=cmbCredits:GameLobbyDropDown
$CC-GO05=lblTechLevel:XNALabel
$CC-GO06=cmbTechLevel:GameLobbyDropDown
$CC-GO07=lblGameSpeedCap:XNALabel
$CC-GO08=cmbGameSpeedCap:GameLobbyDropDown

; Left column checkboxes
; Registered before right column and bottom dropdowns — both depend on these.
$CC-GO09=chkShortGame:GameLobbyCheckBox
$CC-GO10=chkRedeplMCV:GameLobbyCheckBox
$CC-GO11=chkStolenTech:GameLobbyCheckBox
$CC-GO12=chkNavalCombat:GameLobbyCheckBox
$CC-GO13=chkMentalAI:GameLobbyCheckBox
$CC-GO14=chkImmuneDerricks:GameLobbyCheckBox
$CC-GO15=chkNoSpawnPreviews:GameLobbyCheckBox

; Right column checkboxes (anchor Y to chkShortGame)
$CC-GO16=chkBuildOffAlly:GameLobbyCheckBox
$CC-GO17=chkIngameAllying:GameLobbyCheckBox
$CC-GO18=chkCrates:GameLobbyCheckBox
$CC-GO19=chkNoGarrisons:GameLobbyCheckBox
$CC-GO20=chkLimitedMCV:GameLobbyCheckBox
$CC-GO21=chkFreeRadar:GameLobbyCheckBox
$CC-GO22=chkConYardStart:GameLobbyCheckBox

; Bottom dropdown row: Ore Growth, Tech Defense, Superweapons
; Registered last — lblOreGrowth anchors to getBottom(chkNoSpawnPreviews).
$CC-GO23=lblOreGrowth:XNALabel
$CC-GO24=cmbOreGrowth:GameLobbyDropDown
$CC-GO25=lblTechDefense:XNALabel
$CC-GO26=cmbTechDefense:GameLobbyDropDown
$CC-GO27=lblSuperweapons:XNALabel
$CC-GO28=cmbSuperweapons:GameLobbyDropDown

; Nerf AI in 8p hehe
$CC-GO29=chkDEVNerfEights:GameLobbyCheckBox

; Full-width checkbox below the bottom dropdown row
$CC-GO30=chkBalanceTweaks:GameLobbyCheckBox

; Save / Load game option presets
$CC-G099=btnSaveLoadGameOptions:XNAClientButton
; Extra player options toggle
$CC-G0100=btnPlayerExtraOptionsOpen:XNAClientButton

