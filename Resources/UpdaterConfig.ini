; ============================================================================
;  UpdaterConfig.ini  -  CnCNet client updater download mirrors
; ============================================================================
;  This file tells every player's client where to pull updated mod files from.
;  It ships inside the full copy you hand to players and is read on each launch.
;
;  Mirror line format (one per index under [DownloadMirrors]):
;      <index>=<base URL, must end with '/'>,<display name>,<location label>
;
;  The client fetches each file as:  <base URL> + <path relative to the MO folder>
;  e.g.  rulesmo.ini                       -> <base URL>rulesmo.ini
;        INI/Game Options/Balance Tweaks.ini -> <base URL>INI/Game%20Options/Balance%20Tweaks.ini
;  ...and the remote manifest as:    <base URL>version
;
;  >>> EDIT THE URL BELOW to your own update repo. <<<
;  GitHub Pages (recommended - predictable caching, handles %20 paths cleanly):
;      https://<user>.github.io/<repo>/
;  GitHub raw (works too, ~5 min CDN cache):
;      https://raw.githubusercontent.com/<user>/<repo>/main/
; ============================================================================

[DownloadMirrors]
0=https://gelebflamefinger.github.io/mo/,GitHub Pages,Global
1=https://raw.githubusercontent.com/gelebflamefinger/mo/main/,GitHub raw,Global

; Files the updater should NOT flag as "modified" / try to restore.
; Keep every player-specific or per-match file here so nobody's local setup
; is nagged about or clobbered.
[Settings]
IgnoreMasks=RA2MO.ini,spawn.ini,spawnmap.ini,KeyboardMD.ini,DDrawCompatOverlay-gamemd.ini,Client\*,Debug\*,*.log,*.dmp,*.demo,*save*
