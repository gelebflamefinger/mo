; Mental Omega theme — window sizes, background textures, and border decorations.
; This file is loaded for all windows in the Mental Omega theme.

[GenericWindow]
DrawMode=Stretched
DrawBorders=true

; ==============================
; Lobby window sizes
; ==============================

[SkirmishLobby]
DrawMode=Stretched
DrawBorders=false
Size=1200,710

[MultiplayerGameLobby]
DrawMode=Stretched
DrawBorders=false
Size=1200,710

[CnCNetLobby]
DrawMode=Stretched
DrawBorders=false
Size=1200,710

; ==============================
; Dialog / popup windows
; ==============================

[PrivacyNotification]
DrawBorders=false
DrawMode=Stretched

[GameInProgressWindow]
DrawMode=Stretched
DrawBorders=false

[GameLoadingWindow]
DrawMode=Stretched
DrawBorders=false

[StatisticsWindow]
DrawMode=Stretched
DrawBorders=false

[UpdateWindow]
DrawMode=Stretched

[UpdateQueryWindow]
DrawMode=Stretched

[PrivateMessageNotificationBox]
DrawMode=Stretched

[PrivateMessagingPanel]
DrawMode=Stretched

[PrivateMessagingWindow]
DrawMode=Stretched
DrawBorders=false

[PasswordRequestWindow]
DrawMode=Stretched

[CnCNetLoginWindow]
DrawMode=Tiled
DrawBorders=false

[GameCreationWindow]
DrawMode=Tiled

[LANGameCreationWindow]
DrawMode=Tiled

; ==============================
; Border decorations — applied to all windows via [ExtraControls]
; (Lobby-specific borders are handled by GameLobbyBase.ini $CC22-$CC29)
; ==============================

[ExtraControls]
0=rabt:XNAExtraPanel
1=rabb:XNAExtraPanel
2=rabl:XNAExtraPanel
3=rabr:XNAExtraPanel
4=ractl:XNAExtraPanel
5=ractr:XNAExtraPanel
6=racbl:XNAExtraPanel
7=racbr:XNAExtraPanel

[rabt]
Location=0,-8
BackgroundTexture=rabt.png
DrawMode=Stretched
Size=0,9
FillWidth=0

