; Mental Omega theme configuration — UI colors, fonts, and global client settings.
; Inherits base defaults from GlobalThemeSettings.ini and overrides MO-specific values.

[INISystem]
BasedOn=..\GlobalThemeSettings.ini

[General]
; Primary UI text color (most labels, list items)
UILabelColor=198,199,210
; Foreground color for interactive controls (buttons, dropdowns, chat boxes)
AltUIColor=198,199,210
; Background color for interactive controls
AltUIBackgroundColor=25,25,25
; Disabled button color
DisabledButtonColor=96,96,96
; Admin name color in channel player lists
AdminNameColor=153,178,255
; Player name color in channel player lists
PlayerNameColor=198,199,210
; Default chat message color
DefaultChatColor=173,215,231
DefaultPersonalChatColorIndex=0
; Private message colors
PrivateMessageColor=255,255,255
PrivateMessageOtherUserColor=160,210,255
; Misc UI colors
LockedGameColor=138,118,118
ListBoxFocusColor=36,72,72
HoverOnGameColor=0,0,0
TrackBarBackgroundColor=21,27,35
PanelBorderColor=150,150,150
WindowBorderColor=150,150,150
; Default CnCNet channel
DefaultChannel=MO
; Main menu background music (plays in client main menu)
MainMenuTheme=mechanized

[GameLobby]
ComboBoxOutlineColor=112,112,112
CoopBriefingForeColor=198,199,210
ComboBoxNondefaultColor=255,255,255
