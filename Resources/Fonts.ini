; Mental Omega — CnCNet client TTF font configuration.
; Enables FontStashSharp TrueType rendering in place of the legacy SpriteFont*.xnb bitmap fonts.
; Place TTF files in Resources\Fonts\. Paths below are relative to this file.
;
; Font indexes are referenced by UI controls via "FontIndex=<n>".
; A font index is entirely TrueType OR entirely SpriteFont — the two cannot be
; mixed within a fallback chain. Fallback only works between TrueType fonts.

[TextShaping]
; HarfBuzz shaping. Only needed for complex scripts (Arabic, Hebrew, Hindi) or ZWJ emoji.
; Leave disabled for Latin / CJK text — it is faster.
Enabled=false
EnableBiDi=false
CacheSize=100

[FontRendering]
; Optional section. Advanced FontStashSharp rasterization settings.
; All properties are optional; the defaults shown here are used when the section is absent.
; Horizontal blur kernel applied to each rasterized glyph. Default: 0 (no blur)
KernelWidth=0
; Vertical blur kernel applied to each rasterized glyph. Default: 0 (no blur)
KernelHeight=0
; Multiplier for the glyph rasterization size. Values > 1 produce sharper output when the
; render target is upscaled at the cost of a larger texture atlas. Default: 1
FontResolutionFactor=1
; Width of each FontStashSharp atlas page in pixels. Default: 1024
TextureWidth=1024
; Height of each FontStashSharp atlas page in pixels. Default: 1024
TextureHeight=1024
; How rasterized glyph pixels are produced.
; Premultiplied  - matches a premultiplied-alpha SpriteBatch (default)
; NonPremultiplied - matches AlphaBlend SpriteBatch
; NoAntialiasing - hard 1-bit edges for pixel-art fonts
GlyphRenderResult=Premultiplied

[Fonts]
; Total number of defined font indexes, including fallback-only targets.
Count=6

; --- UI font indexes -------------------------------------------------------
; Index 0 — default body text (labels, list items, chat)
[Font0]
Type=TrueType
Path=Fonts/Roboto_SemiCondensed-Medium.ttf
Size=13
Fallback=5

; Index 1 — emphasized / navigation text (main menu buttons use this)
[Font1]
Type=TrueType
Path=Fonts/Roboto_SemiCondensed-Bold.ttf
Size=13
Fallback=5

; Index 2 — medium headings
[Font2]
Type=TrueType
Path=Fonts/Roboto_SemiCondensed-Bold.ttf
Size=16
Fallback=5

; Index 3 — large headings (lobby map name, section titles)
[Font3]
Type=TrueType
Path=Fonts/Roboto_SemiCondensed-Bold.ttf
Size=20
Fallback=5

; Index 4 — small text (tooltips, fine print)
[Font4]
Type=TrueType
Path=Fonts/Roboto_SemiCondensed-Medium.ttf
Size=11
Fallback=5

; --- Fallback-only target ------------------------------------------------------
; Index 5 — CJK / broad Unicode coverage for glyphs missing from Roboto.
; Not referenced directly by UI; used via Fallback= above.
[Font5]
Type=TrueType
Path=Fonts/NotoSansSC-Medium.ttf
Size=14
