; Mental Omega APYR 3.3 Mode Client INI
; Balance Tweaks
;
; Partially reverts the Chronosphere and Iron Curtain nerfs.
;
; Chronosphere:
;   - Chronoshift can be used on enemy units again (transports vehicles,
;     kills infantry as in the classic behaviour).
;   - Chrono Legionnaires can now be picked up and teleported by the
;     Chronosphere instead of being ignored/killed.
;
; Iron Curtain:
;   - Can be used offensively on enemy vehicles and buildings.
;   - Still instantly kills any infantry caught in its radius.

; ---------------------------------------------------------------------------
; Chronosphere
; ---------------------------------------------------------------------------

; MO sets this to no, which makes the Chronosphere teleport infantry safely
; instead of killing them. Restore the classic "infantry are crushed" behaviour.
[General]
ChronoInfantryCrush=yes

; MO restricts the Chronosphere to "units" (vehicles only) and to friendly
; houses. Re-add "infantry" to the target filter and allow enemy houses so the
; classic behaviour returns: vehicles are transported, infantry are killed.
[ChronoSphereSpecial]
SW.AffectsHouse=owner,allies,enemies
SW.AffectsTarget=infantry,units

[ChronoWarpSpecial]
SW.AffectsHouse=owner,allies,enemies
SW.AffectsTarget=infantry,units

; Let the Chronosphere grab Chrono Legionnaires and move them rather than
; leaving them behind / destroying them.
[CLEG]
Chronoshift.Allow=yes
Chronoshift.Crushable=no

[AICLEG]
Chronoshift.Allow=yes
Chronoshift.Crushable=no

; ---------------------------------------------------------------------------
; Iron Curtain
; ---------------------------------------------------------------------------

[IronCurtainSpecial]
SW.AffectsHouse=owner,allies,enemies
SW.AffectsTarget=units,buildings

; Default is already "kill"; set explicitly so infantry caught in the field die.
[CombatDamage]
IronCurtain.EffectOnOrganics=kill

;END OF FILE
